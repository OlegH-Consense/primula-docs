# Geany: тип файла «Primula» (Primula Documenting System v1.1-draft, *.prml).
#
# ВАЖНО: Geany не умеет регулярных выражений и своих лексеров — подсветку
# даёт заимствованный лексер «Matlab/Octave» (комментарии «%», строки «"…"»,
# числа, список слов). Это приближение, а не точный разбор Primula:
#   + «|% комментарий» (до конца строки), строки "…", числа, управляющие слова
#     и часть команд (слова из [keywords]) выделяются;
#   – «|команда» целиком и структурные формы |< |> |- не распознаются;
#   – после «|#» (элемент нумерованного списка) остаток строки ошибочно
#     показывается как комментарий (лексер Octave считает «#» комментарием);
#   – апостроф в тексте («п'ять») не ломает подсветку: одинарные кавычки
#     отключены ниже (стиль string = default).
# Точная подсветка — в Kate/KWrite (primula.xml), а также mcedit (primula.syntax).
#
# Цвета задаёт цветовая схема Geany (Вид → Цветовые схемы; стили ниже — именованные), в бледной
# схеме подсветка тоже бледная: выберите схему с более насыщенными цветами.
#
# Файл создаётся tools/gen_geany.py из tools/geany.conf.in и словаря; список слов не править вручную.
#
# Установка: скопировать этот файл в ~/.config/geany/filedefs/ и добавить в
# ~/.config/geany/filetype_extensions.conf, раздел [Extensions], строку
#   Primula=*.prml;
# затем перезапустить Geany. Имя «Matlab/Octave» в lexer_filetype — как в Geany 2.0.

[styling]
# Имена стилей — из лексера Matlab; значения — именованные стили цветовой схемы
default=default
comment=comment_line
command=default
number=number_1
keyword=keyword_1
# одинарные кавычки: в тексте это апострофы, поэтому без выделения
string=default
# «|» и скобки — keyword_2, чтобы команды читались как единое целое
operator=keyword_2
identifier=default
doublequotedstring=string_1

[keywords]
# Одна строка. Список СОЗДАЁТСЯ tools/gen_geany.py из словаря (lexicon.json), не править вручную.
# В него не входят слова, которые часто встречаются в тексте и в полях данных (code, name, list,
# page, section, header, footer, link, set, block, part, scope, index, row, cell, caption, call,
# export): иначе они подсвечивались бы вне команд. Входят управляющие конструкции и закрывающие
# маркеры (разд. 3.5), остальные команды, слова ядра (разд. 12.2).
primary=if elif else for def endif endfor enddef end include import abbr appendix comment endnote figure fmt footnote frame img let list_of newcolumn newpage parallel segment table toc toc_entry track verbatim watermark return while break continue pass in not and or is None True False

[settings]
lexer_filetype=Matlab/Octave
extension=prml
mime_type=text/x-primula
# комментарий Primula: «|% …» до конца строки (Ctrl+E — закомментировать)
comment_single=|%
comment_use_indent=true

[indentation]
width=2
# 0 — пробелы
type=0

[build-menu]
# Меню «Сборка»: проверка и сборка ODT (primula check / primula build, разд. 14.1)
FT_00_LB=_Проверить
FT_00_CM=primula check "%f"
FT_00_WD=
FT_01_LB=_Собрать ODT
FT_01_CM=primula build "%f" -o "%e.odt"
FT_01_WD=
EX_00_LB=_Собрать ODT и PDF
EX_00_CM=primula build "%f" -o "%e.odt" --pdf
EX_00_WD=
